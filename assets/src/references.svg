<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="title desc">
  <title id="title">参照資料の 2 層と更新の流れ</title>
  <desc id="desc">スキルはまず蒸留版を読み、索引が指す原典ファイルだけを読む。保守スキル yokai-refs-update が鮮度を確かめ、原典 clone を pull し、蒸留版を再蒸留する。</desc>
  <style>
    /*@FONTS@*/
    text { font-family: "YokaiJP", "Hiragino Sans", "Noto Sans CJK JP", "Yu Gothic", sans-serif; fill: #2b2622; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .h { font-size: 15px; font-weight: 700; }
    .b { font-size: 14px; font-weight: 700; }
    .s { font-size: 13px; }
    .mute { fill: #6b625a; }
    .card { fill: #fffcf5; stroke: #d8cfc0; stroke-width: 1.5; }
    .chip { fill: #efe7d8; stroke: #d8cfc0; stroke-width: 1; }
  </style>
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#2b2622"/></marker>
    <marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#2f4b7c"/></marker>
  </defs>

  <rect x="0.75" y="0.75" width="958.5" height="338.5" rx="14" fill="#f7f3ea" stroke="#d8cfc0" stroke-width="1.5"/>

  <text x="24" y="42" class="h">読むとき</text>

  <g transform="translate(24 60)">
    <rect width="220" height="96" rx="10" class="card"/>
    <text x="20" y="32" class="b">スキル</text>
    <text x="20" y="56" class="m s mute">SKILL.md</text>
    <text x="20" y="76" class="s mute">どの資料を読むかを決める</text>
  </g>
  <g transform="translate(316 60)">
    <rect width="280" height="96" rx="10" class="card"/>
    <text x="20" y="32" class="b">蒸留版</text>
    <text x="20" y="56" class="m s mute">skills/&lt;name&gt;/references/*.md</text>
    <text x="20" y="76" class="s mute">要点と索引。250 行以内</text>
  </g>
  <g transform="translate(668 60)">
    <rect width="268" height="96" rx="10" class="card"/>
    <text x="20" y="32" class="b">原典 clone</text>
    <text x="20" y="56" class="m s mute">references/&lt;repo&gt;/</text>
    <text x="20" y="76" class="s mute">全文。食い違ったらこちらが正</text>
  </g>
  <path d="M244 108 H 308" stroke="#2b2622" stroke-width="2" fill="none" marker-end="url(#ink)"/>
  <text x="258" y="98" class="s">まず</text>
  <path d="M596 108 H 660" stroke="#2b2622" stroke-width="2" fill="none" marker-end="url(#ink)"/>
  <text x="604" y="98" class="s">索引の先</text>

  <text x="24" y="206" class="h">更新するとき <tspan class="s mute" font-weight="400">— 作業コピーの Claude Code で </tspan><tspan class="m s" font-weight="700">/yokai-refs-update</tspan></text>

  <g transform="translate(24 224)">
    <rect width="190" height="64" rx="10" class="chip"/>
    <text x="16" y="27" class="b">鮮度チェック</text>
    <text x="16" y="48" class="m s mute">check-freshness.sh</text>
  </g>
  <g transform="translate(254 224)">
    <rect width="190" height="64" rx="10" class="chip"/>
    <text x="16" y="27" class="b">BEHIND</text>
    <text x="16" y="48" class="s mute">原典 clone を pull</text>
  </g>
  <g transform="translate(484 224)">
    <rect width="190" height="64" rx="10" class="chip"/>
    <text x="16" y="27" class="b">STALE / DEAD</text>
    <text x="16" y="48" class="s mute">蒸留版を作り直す</text>
  </g>
  <g transform="translate(714 224)">
    <rect width="222" height="64" rx="10" class="chip"/>
    <text x="16" y="27" class="b">取り込み候補</text>
    <text x="16" y="48" class="s mute"><tspan class="m">ADOPTION.md</tspan> に記録</text>
  </g>
  <path d="M214 256 H 246" stroke="#2f4b7c" stroke-width="2" fill="none" marker-end="url(#ai)"/>
  <path d="M444 256 H 476" stroke="#2f4b7c" stroke-width="2" fill="none" marker-end="url(#ai)"/>
  <path d="M674 256 H 706" stroke="#2f4b7c" stroke-width="2" fill="none" marker-end="url(#ai)"/>

  <text x="24" y="318" class="s mute">REVIEW (出所を追わない自作の知識ベース) は期限が来たら中身を見直す。日付だけは進めない</text>
</svg>
