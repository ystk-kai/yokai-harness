<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="title desc">
  <title id="title">参照資料の 2 層と更新の流れ</title>
  <desc id="desc">スキルはまず蒸留版を読み、索引が指す原典ファイルだけを読む。保守スキル yokai-refs-update が鮮度を確かめ、原典 clone を pull し、蒸留版を再蒸留する。</desc>
  <style>
    /*@FONTS@*/
    text { font-family: "YokaiJP", "Hiragino Sans", "Noto Sans CJK JP", "Yu Gothic", sans-serif; fill: #e8f0ff; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .h { font-size: 15px; font-weight: 700; fill: #a9bcdc; }
    .b { font-size: 14px; font-weight: 700; }
    .s { font-size: 13px; }
    .mute { fill: #a9bcdc; }
    .card { fill: #11244a; stroke: #2a4675; stroke-width: 1.5; }
    .chip { fill: #0f2142; stroke: #2a4675; stroke-width: 1; }
  </style>
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#63b3ff"/></marker>
    <marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#c9dcff"/></marker>
    <!-- 製品アイコン: Simple Icons (CC0)。Git のみ CC BY 3.0 (Jason Long)。商標は各社に帰属 -->
    <symbol id="i-claude" viewBox="0 0 24 24"><path d="m4.7144 15.9555 4.7174-2.6471.079-.2307-.079-.1275h-.2307l-.7893-.0486-2.6956-.0729-2.3375-.0971-2.2646-.1214-.5707-.1215-.5343-.7042.0546-.3522.4797-.3218.686.0608 1.5179.1032 2.2767.1578 1.6514.0972 2.4468.255h.3886l.0546-.1579-.1336-.0971-.1032-.0972L6.973 9.8356l-2.55-1.6879-1.3356-.9714-.7225-.4918-.3643-.4614-.1578-1.0078.6557-.7225.8803.0607.2246.0607.8925.686 1.9064 1.4754 2.4893 1.8336.3643.3035.1457-.1032.0182-.0728-.164-.2733-1.3539-2.4467-1.445-2.4893-.6435-1.032-.17-.6194c-.0607-.255-.1032-.4674-.1032-.7285L6.287.1335 6.6997 0l.9957.1336.419.3642.6192 1.4147 1.0018 2.2282 1.5543 3.0296.4553.8985.2429.8318.091.255h.1579v-.1457l.1275-1.706.2368-2.0947.2307-2.6957.0789-.7589.3764-.9107.7468-.4918.5828.2793.4797.686-.0668.4433-.2853 1.8517-.5586 2.9021-.3643 1.9429h.2125l.2429-.2429.9835-1.3053 1.6514-2.0643.7286-.8196.85-.9046.5464-.4311h1.0321l.759 1.1293-.34 1.1657-1.0625 1.3478-.8804 1.1414-1.2628 1.7-.7893 1.36.0729.1093.1882-.0183 2.8535-.607 1.5421-.2794 1.8396-.3157.8318.3886.091.3946-.3278.8075-1.967.4857-2.3072.4614-3.4364.8136-.0425.0304.0486.0607 1.5482.1457.6618.0364h1.621l3.0175.2247.7892.522.4736.6376-.079.4857-1.2142.6193-1.6393-.3886-3.825-.9107-1.3113-.3279h-.1822v.1093l1.0929 1.0686 2.0035 1.8092 2.5075 2.3314.1275.5768-.3218.4554-.34-.0486-2.2039-1.6575-.85-.7468-1.9246-1.621h-.1275v.17l.4432.6496 2.3436 3.5214.1214 1.0807-.17.3521-.6071.2125-.6679-.1214-1.3721-1.9246L14.38 17.959l-1.1414-1.9428-.1397.079-.674 7.2552-.3156.3703-.7286.2793-.6071-.4614-.3218-.7468.3218-1.4753.3886-1.9246.3157-1.53.2853-1.9004.17-.6314-.0121-.0425-.1397.0182-1.4328 1.9672-2.1796 2.9446-1.7243 1.8456-.4128.164-.7164-.3704.0667-.6618.4008-.5889 2.386-3.0357 1.4389-1.882.929-1.0868-.0062-.1579h-.0546l-6.3385 4.1164-1.1293.1457-.4857-.4554.0608-.7467.2307-.2429 1.9064-1.3114Z"/></symbol>
    <symbol id="i-git" viewBox="0 0 24 24"><path d="M13.09 23.549a1.54 1.54 0 0 1-2.18 0L.451 13.089a1.54 1.54 0 0 1 0-2.179l7.191-7.19 2.733 2.733a1.85 1.85 0 0 0 .964 2.326v6.66a1.849 1.849 0 1 0 1.54 0V8.957l2.508 2.508a1.85 1.85 0 1 0 1.09-1.09l-2.634-2.634a1.85 1.85 0 0 0-2.378-2.377L8.73 2.63 10.91.451a1.54 1.54 0 0 1 2.179 0l10.459 10.46a1.54 1.54 0 0 1 0 2.179z"/></symbol>
  </defs>

  <rect width="960" height="340" rx="16" fill="#0b1830"/>

  <text x="24" y="42" class="h">読むとき</text>

  <g transform="translate(24 60)">
    <rect width="220" height="96" rx="10" class="card"/>
    <text x="20" y="32" class="b">スキル</text>
    <text x="20" y="56" class="m s mute">SKILL.md</text>
    <text x="20" y="76" class="s mute">どの資料を読むかを決める</text>
  </g>
  <g transform="translate(316 60)">
    <rect width="280" height="96" rx="10" class="card"/>
    <text x="20" y="32" class="b">蒸留版</text>
    <text x="20" y="56" class="m s mute">skills/&lt;name&gt;/references/*.md</text>
    <text x="20" y="76" class="s mute">要点と索引。250 行以内</text>
  </g>
  <g transform="translate(668 60)">
    <rect width="268" height="96" rx="10" class="card"/>
    <use href="#i-git" x="20" y="15" width="22" height="22" fill="#F03C2E"/>
    <text x="52" y="32" class="b">原典 clone</text>
    <text x="20" y="56" class="m s mute">references/&lt;repo&gt;/</text>
    <text x="20" y="76" class="s mute">全文。食い違ったらこちらが正</text>
  </g>
  <path d="M244 108 H 308" stroke="#63b3ff" stroke-width="2" fill="none" marker-end="url(#ink)"/>
  <text x="258" y="98" class="s">まず</text>
  <path d="M596 108 H 660" stroke="#63b3ff" stroke-width="2" fill="none" marker-end="url(#ink)"/>
  <text x="604" y="98" class="s">索引の先</text>

  <text x="24" y="206" class="h">更新するとき</text>
  <use href="#i-claude" x="132" y="192" width="17" height="17" fill="#D97757"/>
  <text x="156" y="206" class="s"><tspan class="m" font-weight="700">/yokai-refs-update</tspan><tspan class="mute"> 作業コピーを展開した Claude Code で実行</tspan></text>

  <g transform="translate(24 224)">
    <rect width="190" height="64" rx="10" class="chip"/>
    <text x="16" y="27" class="b">鮮度チェック</text>
    <text x="16" y="48" class="m s mute">check-freshness.sh</text>
  </g>
  <g transform="translate(254 224)">
    <rect width="190" height="64" rx="10" class="chip"/>
    <text x="16" y="27" class="b">BEHIND</text>
    <text x="16" y="48" class="s mute">原典 clone を pull</text>
  </g>
  <g transform="translate(484 224)">
    <rect width="190" height="64" rx="10" class="chip"/>
    <text x="16" y="27" class="b">STALE / DEAD</text>
    <text x="16" y="48" class="s mute">蒸留版を作り直す</text>
  </g>
  <g transform="translate(714 224)">
    <rect width="222" height="64" rx="10" class="chip"/>
    <text x="16" y="27" class="b">取り込み候補</text>
    <text x="16" y="48" class="s mute"><tspan class="m">ADOPTION.md</tspan> に記録</text>
  </g>
  <path d="M214 256 H 246" stroke="#c9dcff" stroke-width="2" fill="none" marker-end="url(#ai)"/>
  <path d="M444 256 H 476" stroke="#c9dcff" stroke-width="2" fill="none" marker-end="url(#ai)"/>
  <path d="M674 256 H 706" stroke="#c9dcff" stroke-width="2" fill="none" marker-end="url(#ai)"/>

  <text x="24" y="318" class="s mute">REVIEW (出所を追わない自作の知識ベース) は期限が来たら中身を見直す。日付だけは進めない</text>
</svg>
