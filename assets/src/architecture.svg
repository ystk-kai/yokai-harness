<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 680" width="960" height="680" role="img" aria-labelledby="title desc">
  <title id="title">yokai-harness の配り方</title>
  <desc id="desc">このリポジトリを正本に、plugin か install.sh で Claude Code・Codex・Gemini CLI へ配る。OpenCode と Cursor は skills ディレクトリを自分で読む。原典 clone は ~/.local/share/yokai-harness/references に置く。</desc>
  <style>
    /*@FONTS@*/
    text { font-family: "YokaiJP", "Hiragino Sans", "Noto Sans CJK JP", "Yu Gothic", sans-serif; fill: #e8f0ff; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .h { font-size: 15px; font-weight: 700; fill: #a9bcdc; }
    .b { font-size: 14px; font-weight: 700; }
    .s { font-size: 13px; }
    .mute { fill: #a9bcdc; }
    .card { fill: #11244a; stroke: #2a4675; stroke-width: 1.5; }
    .rule { stroke: #22395f; stroke-width: 1; }
    .sky { fill: #63b3ff; }
    .ice { fill: #c9dcff; }
  </style>
  <defs>
    <marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#63b3ff"/></marker>
    <marker id="a-ice" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#c9dcff"/></marker>
