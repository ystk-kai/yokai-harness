  <rect width="960" height="680" rx="16" fill="#0b1830"/>

  <!-- 列見出し -->
  <text x="344" y="40" class="h">配り方 (どちらか、または併用)</text>
  <text x="668" y="40" class="h">エージェント</text>

  <!-- 正本: このリポジトリ -->
  <rect x="24" y="56" width="280" height="540" rx="12" class="card"/>
  <image x="79" y="68" width="170" height="98" href="@EMBED:emblem.png@"/>
  <text x="164" y="190" class="m b" text-anchor="middle">yokai-harness</text>
  <line x1="44" y1="206" x2="284" y2="206" class="rule"/>
  <g transform="translate(44 232)">
    <text class="m b">skills/</text>
    <text y="22" class="s">配るスキル 5 本</text>
    <text y="44" class="m s mute">harness-design / ui-design</text>
    <text y="62" class="m s mute">ja-writing / ja-slop-review</text>
    <text y="80" class="m s mute">visual-slop-review</text>
  </g>
  <line x1="44" y1="328" x2="284" y2="328" class="rule"/>
  <g transform="translate(44 354)">
    <text class="m b">instructions/</text>
    <text y="22" class="s">グローバル指示の正本</text>
  </g>
  <line x1="44" y1="392" x2="284" y2="392" class="rule"/>
  <g transform="translate(44 418)">
    <text class="m b">maintenance/</text>
    <text y="22" class="s">保守スキル <tspan class="m">yokai-refs-update</tspan></text>
    <text y="42" class="s mute">plugin では読み込まない</text>
  </g>
  <line x1="44" y1="476" x2="284" y2="476" class="rule"/>
  <g transform="translate(44 498)">
    <text class="m b">.claude-plugin/</text>
    <text y="20" class="m b">.agents/plugins/</text>
    <text y="42" class="s">plugin と marketplace の定義</text>
  </g>
  <line x1="44" y1="554" x2="284" y2="554" class="rule"/>
  <text x="44" y="580" class="m b">install.sh</text>

  <!-- ① plugin -->
  <rect x="344" y="56" width="272" height="180" rx="12" class="card"/>
  <rect x="344" y="56" width="4" height="180" rx="2" class="sky"/>
  <g transform="translate(366 90)">
    <text class="b sky">① plugin で入れる</text>
    <use href="#i-claude" x="0" y="15" width="15" height="15" fill="#D97757"/>
    <text x="22" y="28" class="s">Claude Code</text>
    <text y="47" class="m mute" font-size="11">/plugin install yokai@yokai-harness</text>
    <use href="#i-openai" x="0" y="61" width="15" height="15" fill="#e8f0ff"/>
    <text x="22" y="74" class="s">Codex</text>
    <text y="93" class="m mute" font-size="11">codex plugin add yokai@yokai-harness</text>
    <text y="124" class="s mute">スキル名に <tspan class="m">yokai:</tspan> が付く</text>
  </g>

  <!-- ② install.sh -->
  <rect x="344" y="264" width="272" height="220" rx="12" class="card"/>
  <rect x="344" y="264" width="4" height="220" rx="2" class="ice"/>
  <g transform="translate(366 298)">
    <text class="b ice">② install.sh で展開する</text>
    <text y="26" class="m mute" font-size="11.5">install.sh --targets claude,codex</text>
    <text y="54" class="s">skills を symlink する</text>
    <text y="74" class="s mute">plugin と併用するなら <tspan class="m">--skills none</tspan></text>
    <text y="100" class="s">指示ファイルへブロックを貼る</text>
    <text y="126" class="s">原典を clone する</text>
    <text y="146" class="s mute"><tspan class="m">--with-references</tspan> のときだけ</text>
    <text y="172" class="s mute">既定は claude だけ。前回の選択を覚える</text>
  </g>

  <!-- エージェント -->
  <g transform="translate(668 56)">
    <rect width="268" height="80" rx="12" class="card"/>
    <use href="#i-claude" x="20" y="13" width="22" height="22" fill="#D97757"/>
    <text x="52" y="30" class="b">Claude Code</text>
    <text x="20" y="52" class="m s mute">~/.claude/skills/</text>
    <text x="20" y="70" class="m s mute">~/.claude/CLAUDE.md</text>
  </g>
  <g transform="translate(668 152)">
    <rect width="268" height="80" rx="12" class="card"/>
    <use href="#i-openai" x="20" y="13" width="22" height="22" fill="#e8f0ff"/>
    <text x="52" y="30" class="b">Codex</text>
    <text x="20" y="52" class="m s mute">~/.agents/skills/</text>
    <text x="20" y="70" class="m s mute">~/.codex/AGENTS.md</text>
  </g>
  <g transform="translate(668 248)">
    <rect width="268" height="80" rx="12" class="card"/>
    <use href="#i-gemini" x="20" y="13" width="22" height="22" fill="#8E75B2"/>
    <text x="52" y="30" class="b">Gemini CLI</text>
    <text x="20" y="52" class="m s mute">~/.agents/skills/</text>
    <text x="20" y="70" class="m s mute">~/.gemini/GEMINI.md</text>
  </g>
  <g transform="translate(668 364)">
    <rect width="268" height="120" rx="12" fill="none" stroke="#3b5a8c" stroke-width="1.5" stroke-dasharray="6 5"/>
    <use href="#i-opencode" x="20" y="14" width="20" height="20" fill="#e8f0ff"/>
    <use href="#i-cursor" x="48" y="13" width="22" height="22" fill="#e8f0ff"/>
    <text x="82" y="30" class="b">OpenCode / Cursor</text>
    <text x="20" y="54" class="s">上の 2 つの skills ディレクトリを</text>
    <text x="20" y="74" class="s">自分で読みに行く</text>
    <text x="20" y="100" class="s mute">対象に指定しなくてよい</text>
  </g>

  <!-- 正本 → 配り方 -->
  <path d="M304 146 H 336" stroke="#63b3ff" stroke-width="2" fill="none" marker-end="url(#a-sky)"/>
  <path d="M304 374 H 336" stroke="#c9dcff" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#a-ice)"/>

  <!-- ① plugin → Claude / Codex (実線)。各カードの上寄りに入る -->
  <g stroke="#63b3ff" stroke-width="2" fill="none">
    <path d="M616 146 H 630 M630 84 V 180"/>
    <path d="M630 84 H 666" marker-end="url(#a-sky)"/>
  </g>

  <!-- ② install.sh → Claude / Codex / Gemini (破線)。各カードの下寄りに入る -->
  <g stroke="#c9dcff" stroke-width="2" stroke-dasharray="6 4" fill="none">
    <path d="M616 300 H 646 M646 112 V 300"/>
    <path d="M646 112 H 666" marker-end="url(#a-ice)"/>
    <path d="M646 208 H 666" marker-end="url(#a-ice)"/>
    <path d="M646 288 H 666" marker-end="url(#a-ice)"/>
  </g>

  <!-- ① → Codex は ② の縦線をまたぐので、地色の縁取りで上に重ねる -->
  <path d="M634 180 H 660" stroke="#0b1830" stroke-width="6" fill="none"/>
  <path d="M630 180 H 666" stroke="#63b3ff" stroke-width="2" fill="none" marker-end="url(#a-sky)"/>

  <!-- ② → 原典 clone -->
  <path d="M480 484 V 604" stroke="#c9dcff" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#a-ice)"/>
  <rect x="24" y="612" width="912" height="52" rx="12" fill="#0f2142" stroke="#2a4675" stroke-width="1.5"/>
  <use href="#i-git" x="44" y="627" width="22" height="22" fill="#F03C2E"/>
  <text x="76" y="644" class="m b">~/.local/share/yokai-harness/references/</text>
  <text x="440" y="644" class="s mute">原典 clone (約 1GB)。スキルは蒸留版 → 原典の順に読む</text>
</svg>
